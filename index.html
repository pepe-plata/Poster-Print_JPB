<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0ea5e9" />
<title>Poster Print JPB</title>
<link rel="manifest" href="manifest.json" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="icons/icon-512.png" />
<style>
  #splash {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: linear-gradient(160deg, #0ea5e9 0%, #0284c7 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    transition: opacity .4s ease;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  #splash img {
    width: 140px;
    height: 140px;
    border-radius: 32px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
    background: #fff;
  }
  #splash .title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: .02em;
  }
  #splash.hide {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- Splash -->
<div id="splash">
  <img src="icons/icon-512.png" alt="Poster Print JPB" />
  <div class="title">Poster Print JPB</div>
</div>

<header class="topbar">
  <div class="brand">
    <button id="menuBtn" class="btn btn-ghost icon-btn" aria-label="Menú">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <img class="brand-logo" src="icons/icons-64.png" alt="Poster Print JPB" width="32" height="32" />
    <span class="brand-name">Poster Print JPB</span>
  </div>
  <button id="installBtn" class="btn btn-ghost hidden">Instalar</button>
</header>

<main class="layout" id="layout">
  <aside class="sidebar" id="sidebar">
    <section class="panel">
      <h2>1. Tamaño del póster</h2>
      <select id="posterSelect" class="select">
        <optgroup label="Cuadrado" id="optSq">
          <option value="2x2">2×2</option>
          <option value="3x3" selected>3×3</option>
          <option value="4x4">4×4</option>
          <option value="5x5">5×5</option>
          <option value="6x6">6×6</option>
          <option value="7x7">7×7</option>
          <option value="8x8">8×8</option>
        </optgroup>
        <optgroup label="Horizontal" id="optHz">
          <option value="2x1">2×1</option>
          <option value="3x1">3×1</option>
          <option value="3x2">3×2</option>
          <option value="4x1">4×1</option>
          <option value="4x2">4×2</option>
          <option value="4x3">4×3</option>
          <option value="5x1">5×1</option>
          <option value="5x2">5×2</option>
          <option value="5x3">5×3</option>
          <option value="5x4">5×4</option>
          <option value="6x1">6×1</option>
          <option value="6x2">6×2</option>
          <option value="6x3">6×3</option>
          <option value="6x4">6×4</option>
          <option value="6x5">6×5</option>
        </optgroup>
        <optgroup label="Vertical" id="optVt">
          <option value="1x2">1×2</option>
          <option value="1x3">1×3</option>
          <option value="1x4">1×4</option>
          <option value="1x5">1×5</option>
          <option value="1x6">1×6</option>
          <option value="1x7">1×7</option>
          <option value="1x8">1×8</option>
          <option value="2x3">2×3</option>
          <option value="2x4">2×4</option>
          <option value="2x5">2×5</option>
          <option value="2x6">2×6</option>
          <option value="3x4">3×4</option>
          <option value="3x5">3×5</option>
          <option value="3x6">3×6</option>
          <option value="3x7">3×7</option>
          <option value="3x8">3×8</option>
          <option value="4x5">4×5</option>
          <option value="4x6">4×6</option>
          <option value="4x7">4×7</option>
          <option value="4x8">4×8</option>
        </optgroup>
        <option value="custom">Personalizado</option>
      </select>

      <div class="poster-groups" id="posterGroups"></div>

      <div class="custom-box hidden" id="customPosterBox">
        <p class="hint">Tamaño personalizado del póster</p>
        <div class="row">
          <label class="field">
            <span>Ancho</span>
            <input type="number" id="posterW" min="1" step="0.1" value="50" />
          </label>
          <label class="field">
            <span>Alto</span>
            <input type="number" id="posterH" min="1" step="0.1" value="70" />
          </label>
          <label class="field">
            <span>Unidad</span>
            <select id="posterUnit">
              <option value="cm" selected>cm</option>
              <option value="in">in</option>
            </select>
          </label>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>2. Tamaño de hoja</h2>
      <select id="paperSize" class="select">
        <option value="letter" selected>Carta (21.59 × 27.94 cm)</option>
        <option value="a4">A4 (21.0 × 29.7 cm)</option>
        <option value="legal">Oficio (21.59 × 35.56 cm)</option>
        <option value="custom">Personalizado</option>
      </select>
      <div class="custom-box hidden" id="customPaperBox">
        <div class="row">
          <label class="field">
            <span>Ancho</span>
            <input type="number" id="paperW" min="1" step="0.1" value="21" />
          </label>
          <label class="field">
            <span>Alto</span>
            <input type="number" id="paperH" min="1" step="0.1" value="29.7" />
          </label>
          <label class="field">
            <span>Unidad</span>
            <select id="paperUnit">
              <option value="cm" selected>cm</option>
              <option value="in">in</option>
            </select>
          </label>
        </div>
      </div>
    </section>

    <section class="panel">
      <h2>3. Márgenes</h2>
      <div class="margins-grid">
        <label class="field"><span>Superior</span><input type="number" id="mTop" min="0" step="0.01" value="0.3" /></label>
        <label class="field"><span>Inferior</span><input type="number" id="mBottom" min="0" step="0.01" value="0.51" /></label>
        <label class="field"><span>Izquierdo</span><input type="number" id="mLeft" min="0" step="0.01" value="0.64" /></label>
        <label class="field"><span>Derecho</span><input type="number" id="mRight" min="0" step="0.01" value="0.63" /></label>
      </div>
      <p class="hint">Valores en cm.</p>
    </section>

    <section class="panel">
      <h2>4. Imagen</h2>
      <label class="file-btn">
        <input type="file" id="imageInput" accept="image/*" hidden />
        <span>Seleccionar imagen</span>
      </label>

      <label class="check">
        <input type="checkbox" id="keepAspect" checked />
        <span>Conservar relación de aspecto</span>
      </label>

      <div class="custom-box" id="imageSizeBox">
        <p class="hint">Tamaño de la imagen</p>
        <div class="row">
          <label class="field">
            <span>Ancho (cm)</span>
            <input type="number" id="imgWcm" min="0.1" step="0.1" value="" disabled />
          </label>
          <label class="field">
            <span>Alto (cm)</span>
            <input type="number" id="imgHcm" min="0.1" step="0.1" value="" disabled />
          </label>
        </div>
      </div>

      <div class="image-actions hidden" id="imageActions">
        <button class="btn btn-ghost" id="rotateBtn" title="Rotar 90°">⟳ Rotar 90°</button>
        <button class="btn btn-ghost" id="centerBtn" title="Centrar">⌖ Centrar</button>
        <button class="btn btn-ghost" id="fitBtn" title="Ajustar al área">⤢ Ajustar</button>
        <button class="btn btn-ghost" id="flipHBtn" title="Voltear horizontal">⇋ Flip H</button>
        <button class="btn btn-ghost" id="flipVBtn" title="Voltear vertical">⇵ Flip V</button>
        <button class="btn btn-ghost danger" id="removeImgBtn" title="Quitar imagen">✕ Quitar</button>
      </div>
    </section>

    <div class="summary" id="summary"></div>

    <div class="actions">
      <button class="btn btn-primary" id="generatePdfBtn" disabled>Generar PDF</button>
      <button class="btn btn-secondary hidden" id="previewPdfBtn">Vista previa PDF</button>
      <button class="btn btn-primary hidden" id="downloadPdfBtn">Exportar PDF</button>
    </div>
  </aside>

  <section class="workspace">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="canvas"></canvas>
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🖼️</div>
        <p>Selecciona una imagen para comenzar</p>
      </div>
    </div>
    <div class="statusbar" id="statusbar"></div>
  </section>
</main>

<div class="modal hidden" id="pdfModal">
  <div class="modal-inner">
    <div class="modal-head">
      <h3>Vista previa del PDF</h3>
      <button class="btn btn-ghost" id="closeModalBtn">✕</button>
    </div>
    <iframe id="pdfPreview" class="pdf-frame"></iframe>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
